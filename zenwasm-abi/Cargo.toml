[package]
name = "zenwasm-abi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "cdylib plugin wrapping wasmtime behind a C ABI for WASM module hosting"

[lib]
crate-type = ["cdylib"]

[dependencies]
zenwasm-types = { path = "../zenwasm-types" }
wasmtime = { version = "41", default-features = false, features = ["cranelift", "runtime"] }
